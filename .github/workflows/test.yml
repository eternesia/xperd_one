name: Test (typecheck, build, e2e)

# Menjalankan seluruh verifikasi yang biasa dipakai saat pengembangan:
#   tsc --noEmit → vite build → migrate+seed pada DB KOSONG → Playwright.
# DB sengaja kosong (service container baru tiap run) supaya celah fixture
# seperti tenant tanpa paket / add-on belum di-seed langsung terlihat sebagai
# kegagalan, bukan sebagai spec yang ter-skip tanpa disadari.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: xperd
          MYSQL_USER: xperd
          MYSQL_PASSWORD: xperd
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s

    env:
      NODE_ENV: development
      PORT: "3999"
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: xperd
      MYSQL_PASSWORD: xperd
      MYSQL_DATABASE: xperd
      # Hanya dipakai CI (cookie httpOnly bertanda tangan) — bukan rahasia nyata.
      APP_JWT_SECRET: ci-only-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Migrate + seed (fresh database)
        run: npm run db:setup

      - name: Install Playwright browser (Chrome)
        run: npx playwright install --with-deps chrome

      - name: Start app
        run: |
          nohup node .output/server/index.mjs > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3999/auth || true)
            if [ "$code" = "200" ]; then echo "app up"; exit 0; fi
            sleep 1
          done
          echo "app tidak siap — log:"; cat "$RUNNER_TEMP/app.log"; exit 1

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
