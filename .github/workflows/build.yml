name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build and push (example: 1.0.0)'
        required: true
        type: string
      image_name:
        description: 'Image name override (optional, defaults to repository name)'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image reference
        id: meta
        shell: bash
        run: |
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          IMAGE_NAME="${{ inputs.image_name || github.event.repository.name }}"
          TAG="${{ inputs.image_tag }}"
          echo "full_image=${REGISTRY}/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t "${{ steps.meta.outputs.full_image }}" -f Dockerfile.prod .

      - name: Push image
        run: |
          docker push "${{ steps.meta.outputs.full_image }}"
