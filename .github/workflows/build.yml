name: Build and Push Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build and push (example: 1.0.0)'
        required: false
        default: ''
        type: string
      image_name:
        description: 'Image name override (optional, defaults to repository name)'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image reference(s)
        id: meta
        shell: bash
        run: |
          REGISTRY="ghcr.io"
          # ${{ github.repository }} is the canonical owner/repo (lowercase) so the
          # image name can never drift from the repo (xperd_one vs xperd-one).
          IMAGE_NAME="${{ inputs.image_name || github.repository }}"
          SHA="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          # Consumed by the `deploy` job below (exact image that was just built).
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${SHA}" >> "$GITHUB_OUTPUT"
          # `latest` + the short sha are ALWAYS pushed (also for manual runs) so a
          # deploy can never pick up a stale image; manual runs add their tag too.
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tags=${REGISTRY}/${IMAGE_NAME}:${{ inputs.image_tag }},${REGISTRY}/${IMAGE_NAME}:latest,${REGISTRY}/${IMAGE_NAME}:sha-${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${REGISTRY}/${IMAGE_NAME}:latest,${REGISTRY}/${IMAGE_NAME}:sha-${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image(s)
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IFS=',' read -r -a ARR <<< "${TAGS}"
          ARGS=()
          for T in "${ARR[@]}"; do ARGS+=(-t "$T"); done
          echo ">>> Building ${TAGS}"
          docker build "${ARGS[@]}" -f Dockerfile.prod .
          for T in "${ARR[@]}"; do
            echo ">>> Pushing ${T}"
            docker push "$T"
          done
