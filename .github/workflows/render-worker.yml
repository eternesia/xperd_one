name: Build Render Worker Image

# Mesin render Template Studio AI (render-worker/). Dibangun hanya bila foldernya berubah,
# terpisah dari image aplikasi utama. Dijalankan di VPS: lihat docs/AI-STUDIO.md.
on:
  push:
    branches: [master]
    paths: ["render-worker/**", ".github/workflows/render-worker.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: render-worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-render-worker:latest
            ghcr.io/${{ github.repository }}-render-worker:sha-${{ github.sha }}
          cache-from: type=gha,scope=render-worker
          cache-to: type=gha,scope=render-worker,mode=max
