name: Deploy Docker Image (Manager)

# Setelah workflow "Build and Push Docker Image" sukses di master (atau manual):
# SSH ke server -> /var/www/html/xperd-one-production -> compose pull -> up -d.
on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.1
        with:
          host: 43.157.241.82
          username: ubuntu
          port: 22
          key: ${{ secrets.SSH_MANAGER_PRIVATE_KEY }}
          envs: GH_TOKEN,GH_ACTOR
          script: |
            set -euo pipefail
            cd /var/www/html/xperd-one-production
            pwd

            # Token bawaan CI/CD (GITHUB_TOKEN) hanya untuk login ghcr.io selama job ini.
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker compose -f docker-compose.prod.yml ps

            docker logout ghcr.io || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
